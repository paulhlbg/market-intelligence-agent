[project]
name = "mie"
version = "0.1.0"
description = "Market Intelligence Engine — kalibrierte Wahrscheinlichkeiten für Kursverhalten (Forschungsprojekt; Modelloutputs, keine Anlageberatung)"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "pandas>=3.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mie"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
